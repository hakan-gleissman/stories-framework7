<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Berätta historier</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&amp;family=Noto+Sans+Cypriot&amp;family=Noto+Sans+Egyptian+Hieroglyphs&amp;family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&amp;display=swap"
      rel="stylesheet"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stories" />

    <meta name="theme-color" content="#796342" />
    <meta
      name="description"
      content="Myter och berättelser – läs om grekisk mytologi och kung Midas."
    />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
  </head>
  <body>
    <div id="app" class="story-shell">
      <header class="app-header">
        <div class="app-header-side">
          <button type="button" class="story-back" hidden aria-label="Tillbaka">
            <span aria-hidden="true">‹</span> Tillbaka
          </button>
        </div>
        <a href="%BASE_URL%" class="story-home external" aria-label="Stories – startsida"
          ><span class="story-ornament" aria-hidden="true">𓏲</span>
          <span class="story-title">Stories</span>
          <span
            class="story-ornament story-ornament-mirrored"
            aria-hidden="true"
            >𓏲</span
          >
        </a>
        <div class="app-header-side app-header-actions">
          <button type="button" class="install-offer" hidden>Visa helskärm</button>
        </div>
      </header>
      <div class="view view-main"></div>
      <footer class="story-footer">
        <div>© 2026 <span class="footer-story-title">Stories</span>: myter och berättelser</div>
      </footer>
    </div>
    <dialog class="install-dialog" aria-labelledby="install-heading" aria-describedby="install-description">
      <h2 id="install-heading">Stories på hemskärmen</h2>
      <p id="install-description"></p>
      <ol class="install-steps"></ol>
      <div class="install-actions">
        <button type="button" class="pergament-knapp" data-install-close>Jag förstår</button>
      </div>
    </dialog>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
